<!doctype html>
<meta charset="utf-8">
<title>Tab Merger</title>
<style>
  :root {
    color-scheme: light dark;
    --fg: #1f1f1f;
    --muted: #5f6368;
    --bg: #ffffff;
    --accent: #0b57d0;
    --accent-fg: #ffffff;
    --border: #c4c7c5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fg: #e3e3e3;
      --muted: #9aa0a6;
      --bg: #1f1f1f;
      --accent: #a8c7fa;
      --accent-fg: #062e6f;
      --border: #444746;
    }
  }
  body {
    width: 300px;
    margin: 0;
    padding: 16px;
    background: var(--bg);
    color: var(--fg);
    font: 13px/1.45 system-ui, -apple-system, sans-serif;
  }
  #summary { margin: 0; }
  #note {
    margin: 8px 0 0;
    color: var(--muted);
    font-size: 12px;
  }
  #note:empty { display: none; }
  #buttons {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    margin-top: 16px;
  }
  button {
    padding: 6px 14px;
    border-radius: 100px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--fg);
    font: inherit;
    cursor: pointer;
  }
  #merge {
    border-color: transparent;
    background: var(--accent);
    color: var(--accent-fg);
  }
  button:disabled { opacity: 0.4; cursor: default; }
</style>

<p id="summary">Checking your windows…</p>
<p id="note"></p>
<div id="buttons">
  <button id="cancel" type="button">Cancel</button>
  <button id="merge" type="button" disabled>Merge</button>
</div>

<script src="popup.js"></script>
